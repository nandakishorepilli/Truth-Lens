[project]
name = "truthlens-backend"
version = "0.1.0"
requires-python = ">=3.12"
# The evaluation core below has NO third-party dependencies.
dependencies = []

[project.optional-dependencies]
# Dependencies for Milestone 1b (FastAPI service, SQLite persistence, test client).
api = ["fastapi>=0.115", "pydantic>=2.7", "sqlalchemy>=2.0", "alembic>=1.13", "httpx>=0.27", "uvicorn>=0.30"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["B008"]
